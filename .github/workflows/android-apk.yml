name: Exportar APK Godot 4.6

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Templates, Keystore e EditorSettings
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$GITHUB_WORKSPACE" > ~/.config/godot/editor_settings-4.6.tres
          cp ~/.config/godot/editor_settings-4.6.tres ~/.config/godot/editor_settings-4.6.3.tres

      - name: Importar recursos e Exportar APK
        run: |
          mkdir -p build/android
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/android/jogo.apk

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Baldis Basics in Funkin 3rd Anniversary Reskin
          path: build/android/BBIFAndroidRelease.apk
